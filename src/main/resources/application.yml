server:
  port: 8080

spring:
  application:
    name: flight-booking-api
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: http://localhost:4200
  routing:
    minimum-connection-time: 45m
    maximum-layover-time: 24h
    maximum-segments: 4
  scheduling:
    reservation-cleanup:
      delay: 60000
      lock-at-least-for: 5s
      lock-at-most-for: 50s
    flight-generation:
      cron: "0 0 2 * * *"
      lock-at-least-for: 5m
      lock-at-most-for: 15m
    seat-generation:
      cron: "0 0 4 * * *"
      lock-at-least-for: 5m
      lock-at-most-for: 15m
  booking:
    cart-ttl: 15m