spring:
  flyway:
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: none

app:
  booking:
    cart-ttl: 15m
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: VGVzdFNlY3JldEtleUZvckpXVFRva2Vuc1Byb3ZpZGVkQnlTcHJpbmdCb290QVBJ
  routing:
    minimum-connection-time: 45m
    maximum-layover-time: 24h
    maximum-segments: 4
  scheduling:
    reservation-cleanup:
      delay: 3600000
      lock-at-least-for: 0s
      lock-at-most-for: 10s
    flight-generation:
      cron: "0 0 2 * * *"
      lock-at-least-for: "5m"
      lock-at-most-for: "15m"
    seat-generation:
      cron: "0 0 4 * * *"
      lock-at-least-for: "5m"
      lock-at-most-for: "15m"